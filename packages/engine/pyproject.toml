[project]
name = "recruit-engine"
version = "0.1.0"
description = "Recruit-ME core engine — scraping, matching, reporting. Pure library: no DB, no auth, no network config."
requires-python = ">=3.12"
dependencies = [
    "openai>=1.30",
    "pymupdf>=1.24",
    "openpyxl>=3.1",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "tenacity>=8.2",
]

[project.optional-dependencies]
# Heavy transitive deps (pandas, etc.). The jobspy scraper degrades gracefully when absent.
jobspy = ["python-jobspy>=1.1.80"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recruit_engine"]
