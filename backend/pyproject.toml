[project]
name = "recruit-api"
version = "0.1.0"
description = "Recruit-ME FastAPI backend. Reads, writes, and enqueues — never runs automation inline."
requires-python = ">=3.12"
dependencies = [
    "recruit-engine",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.5",
    "argon2-cffi>=23.1",
    "pyjwt[crypto]>=2.9",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
]

[tool.uv.sources]
recruit-engine = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recruit_api"]
