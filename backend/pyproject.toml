[project]
name = "recruit-api"
version = "0.1.0"
description = "Recruit-ME FastAPI backend. Reads, writes, and enqueues — never runs automation inline. Filled in Phase 4.2."
requires-python = ">=3.12"
dependencies = [
    "recruit-engine",
]

[tool.uv.sources]
recruit-engine = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recruit_api"]
