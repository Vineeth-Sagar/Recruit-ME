[project]
name = "recruit-worker"
version = "0.1.0"
description = "Recruit-ME background workers — arq consumers running the engine per tenant. Filled in Phase 4.3+."
requires-python = ">=3.12"
dependencies = [
    "recruit-engine",
]

[tool.uv.sources]
recruit-engine = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recruit_worker"]
