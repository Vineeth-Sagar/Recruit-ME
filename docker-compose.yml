# Full local stack: postgres, redis, minio (+ one-shot bucket setup), a one-shot
# migrate job, the API, the arq worker, the scheduler, and the Next.js web app.
#
#   cp .env.example .env
#   docker compose up -d --build      # or: make up
#   docker compose run --rm seed      # or: make seed
#   open http://localhost:3000        # log in as demo@recruit.me / demo-password-123
#
# Host ports are offset (15432 / 16379 / 19000-19001 / 8000 / 3000) so this stack
# coexists with other local projects. For hot-reload dev, also copy
# docker-compose.override.yml.example -> docker-compose.override.yml.
name: recruit-me

# Shared wiring for every Python service. `.env` supplies secrets and provider
# config; these values point the app at the in-network services and win over it.
x-app-env: &app-env
  ENV: ${ENV:-dev}
  DATABASE_URL: postgresql+asyncpg://recruit:recruit@postgres:5432/recruit
  REDIS_URL: redis://redis:6379/0
  S3_ENDPOINT: http://minio:9000
  S3_BUCKET: recruit
  S3_ACCESS_KEY: recruit
  S3_SECRET_KEY: recruit-secret
  S3_REGION: us-east-1

# `api` is the only service that builds recruit-me-api; the one-shots reuse it.
x-api-service: &api-service
  image: recruit-me-api
  env_file:
    - path: .env
      required: false
  environment: *app-env

# `worker` is the only service that builds recruit-me-worker; `scheduler` reuses it.
x-worker-service: &worker-service
  image: recruit-me-worker
  env_file:
    - path: .env
      required: false
  environment: *app-env

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: recruit
      POSTGRES_PASSWORD: recruit
      POSTGRES_DB: recruit
    ports:
      - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recruit -d recruit"]
      interval: 5s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: recruit
      MINIO_ROOT_PASSWORD: recruit-secret
    ports:
      - "19000:9000"
      - "19001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 15

  # One-shot: create the app bucket, then exit.
  minio-setup:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 recruit recruit-secret &&
      mc mb --ignore-existing local/recruit &&
      echo 'bucket ready';
      "

  api:
    <<: *api-service
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  # One-shot: bring the schema to head, then exit. `api`/`worker` wait on this.
  migrate:
    <<: *api-service
    command: ["alembic", "-c", "backend/alembic.ini", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # One-shot: demo tenant + profile + résumé + 3 runs + ~40 matches.
  #   docker compose run --rm seed
  seed:
    <<: *api-service
    command: ["python", "scripts/seed.py"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    profiles: ["tools"]
    restart: "no"

  worker:
    <<: *worker-service
    build:
      context: .
      dockerfile: worker/Dockerfile
    command: ["arq", "recruit_worker.settings.WorkerSettings"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  scheduler:
    <<: *worker-service
    command: ["arq", "recruit_worker.settings.SchedulerSettings"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        API_PROXY_TARGET: http://api:8000
    image: recruit-me-web
    # next.config.mjs also re-reads this when the standalone server boots.
    environment:
      API_PROXY_TARGET: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "fetch('http://localhost:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
