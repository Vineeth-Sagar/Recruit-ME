# Local development infrastructure. Application services (api, worker, scheduler,
# web) are added in Phase 4.7 — for now this brings up the three stateful
# backends the rest of the build targets.
#
# Host ports are deliberately offset (15432 / 16379 / 19000-19001) so this stack
# coexists with other local projects using the default 5432 / 6379 / 9000.
name: recruit-me

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: recruit
      POSTGRES_PASSWORD: recruit
      POSTGRES_DB: recruit
    ports:
      - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recruit -d recruit"]
      interval: 5s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: recruit
      MINIO_ROOT_PASSWORD: recruit-secret
    ports:
      - "19000:9000"
      - "19001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 15

  # One-shot: create the app bucket, then exit.
  minio-setup:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 recruit recruit-secret &&
      mc mb --ignore-existing local/recruit &&
      echo 'bucket ready';
      "

volumes:
  pgdata:
  miniodata:
